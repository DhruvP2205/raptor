name: raptor

# Network topology matches docs/ARCHITECTURE.md Section 4:
#   - data-net: postgres + redis only, no host ports published, ever.
#   - app-net: api + web. web never touches postgres/redis directly.
networks:
  app-net:
  data-net:
    internal: true

volumes:
  postgres-data:
  uploads-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  smtp_credentials:
    file: ./secrets/smtp_credentials.txt
  app_secret:
    file: ./secrets/app_secret.txt
  github_token_key:
    file: ./secrets/github_token_key.txt

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - data-net
    environment:
      POSTGRES_USER: raptor
      POSTGRES_DB: raptor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # No `ports:` — unreachable from the host under any configuration.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - data-net
    # No `ports:` — same isolation rule as postgres.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    networks:
      - app-net
      - data-net
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      API_PORT: 4000
      POSTGRES_USER: raptor
      POSTGRES_DB: raptor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_URL: http://localhost:3000
      # TEST_MODE is intentionally absent here — absence = false.
      # Never set it in this file. See
      # docs/stages/01-auth-and-email-setup.md Section 5.5.
    secrets:
      - postgres_password
      - smtp_credentials
      - app_secret
      - github_token_key
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "4000:4000"

  # Module 6 (Submission Verification) — see docs/ARCHITECTURE.md
  # Section 4 and docs/stages/06-submission-verification.md Section 6.
  # Runs BullMQ against the same Redis instance as the api's rate
  # limiter; never publishes a port, never talked to directly by `web`.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    networks:
      - app-net
      - data-net
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      POSTGRES_USER: raptor
      POSTGRES_DB: raptor
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379
    secrets:
      - postgres_password
      - github_token_key

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      - app-net
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
